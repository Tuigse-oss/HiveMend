name: Feature request
description: A new scanner, tool, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Hivemend do, and what problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: How would it stay safe?
      description: For anything that removes or changes things, how can Hivemend tell it is really stale?
