name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Code scanning can only take uploads once the repository is public (or has
  # GitHub Advanced Security). Until then the analysis is skipped, not failed,
  # and it starts on its own with the first run after the repo goes public.
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Read visibility in its own command so a failed API call fails the
        # step instead of writing an empty value that reads as "private" and
        # silently skips the analysis.
        run: |
          set -euo pipefail
          private=$(gh api "repos/$REPO" --jq '.private')
          case "$private" in
          true) echo "public=false" >> "$GITHUB_OUTPUT" ;;
          false) echo "public=true" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::could not read repository visibility (got '$private')"
            exit 1
            ;;
          esac

  analyze:
    name: analyze (${{ matrix.language }})
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Win32 FFI and the GUI are cfg(windows); the extractor only sees
          # them when it runs where they compile.
          - language: rust
            os: windows-latest
          - language: actions
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust extractor needs the pinned toolchain and the std sources.
      - if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.0 --profile minimal --component rust-src
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  report:
    name: report a failed scheduled run
    # A failed scheduled run only notifies whoever last edited its schedule,
    # so open an issue (or comment on the one already open) to make the
    # failure seen and tracked until it is fixed.
    needs: [visibility, analyze]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled $WORKFLOW run failed"
          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "A scheduled workflow run failed" 2>/dev/null || true
          number=$(TITLE="$title" gh issue list --repo "$REPO" --state open --label ci-failure \
            --json number,title --jq '[.[] | select(.title == $ENV.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            body=$(printf 'The scheduled **%s** workflow failed: %s\n\nClose this issue once it passes again.' "$WORKFLOW" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --label ci-failure --body "$body"
          fi
