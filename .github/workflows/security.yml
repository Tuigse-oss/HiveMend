name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New RustSec advisories are published without any change to this repo,
    # so the lockfile is re-audited every week as well as on every change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: rustsec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      # Checks Cargo.lock against the RustSec advisory database. Fails on any
      # vulnerability, and on unmaintained, unsound, or yanked crates.
      - run: cargo +1.99.0 audit --deny warnings

  dependency-review:
    name: dependency review
    # Needs the dependency graph, which is free once the repository is public.
    # Until then this job is skipped rather than failed.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Every current dependency is MIT or Apache-2.0, plus Unicode-3.0
          # for unicode-ident. Anything else needs a deliberate decision.
          allow-licenses: MIT, Apache-2.0, Unicode-3.0

  report:
    name: report a failed scheduled run
    # A failed scheduled run only notifies whoever last edited its schedule,
    # so open an issue (or comment on the one already open) to make the
    # failure seen and tracked until it is fixed.
    needs: [audit, dependency-review]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled $WORKFLOW run failed"
          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "A scheduled workflow run failed" 2>/dev/null || true
          number=$(TITLE="$title" gh issue list --repo "$REPO" --state open --label ci-failure \
            --json number,title --jq '[.[] | select(.title == $ENV.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            body=$(printf 'The scheduled **%s** workflow failed: %s\n\nClose this issue once it passes again.' "$WORKFLOW" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --label ci-failure --body "$body"
          fi
