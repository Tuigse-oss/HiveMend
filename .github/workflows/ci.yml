name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Win32 FFI and the GUI are cfg(windows), so they are only linted
        # on the Windows runner; Linux covers the cfg(not(windows)) branches.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The #[cfg(windows)] FFI and its live tests only compile and run on
        # Windows; a Linux-only run would ship them unexercised while green.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --locked --all-targets

  installer:
    name: installer (install, upgrade, uninstall)
    # Package managers upgrade by running the new installer over the old one,
    # so every change is checked with two builds of the installer.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 build --locked --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp target/x86_64-pc-windows-msvc/release/Hivemend.exe package/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt README.md package/
      - name: Build an older and a newer installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=0.0.1 /DOutputDir=..\installer-test installer\hivemend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc /DAppVersion=0.0.2 /DOutputDir=..\installer-test installer\hivemend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade, and uninstall
        shell: pwsh
        run: >
          installer\test-installer.ps1
          -Old installer-test\Hivemend-v0.0.1-x86_64-setup.exe -OldVersion 0.0.1
          -New installer-test\Hivemend-v0.0.2-x86_64-setup.exe -NewVersion 0.0.2

  ui:
    name: ui (keyboard, screen reader, scan, repair, restore)
    # Drives the window through Windows UI Automation, as a screen reader or
    # keyboard user would, against stale entries seeded for the test.
    runs-on: windows-latest
    # A wedged UI Automation call must fail the job, not burn the 6 h quota.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 build --locked
      - run: python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Seed stale entries
        shell: pwsh
        run: tests\ui\seed.ps1
      - name: Create a standard account with its own stale entry
        # The runner is an administrator, so a window without administrator
        # rights runs as this account. The runner VM is discarded afterwards.
        shell: pwsh
        run: |
          $password = 'Hm1!' + [guid]::NewGuid().ToString('N').Substring(0, 20)
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser hmtest -Password $secure -PasswordNeverExpires | Out-Null
          "HM_TEST_USER=hmtest" >> $env:GITHUB_ENV
          "HM_TEST_PASSWORD=$password" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force C:\HivemendTest | Out-Null
          Copy-Item tests\ui\seed.ps1 C:\HivemendTest\
          $credential = New-Object Management.Automation.PSCredential('hmtest', $secure)
          $seed = Start-Process powershell -Credential $credential -LoadUserProfile -Wait -PassThru `
            -WorkingDirectory C:\HivemendTest `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'C:\HivemendTest\seed.ps1', '-UserOnly'
          if ($seed.ExitCode -ne 0) { throw "seeding as hmtest failed ($($seed.ExitCode))" }
      - name: Run the UI tests
        run: python -I -u tests\ui\run_ui_tests.py target\debug\Hivemend.exe ui-test-output
      - name: Remove the seeded entries
        if: always()
        shell: pwsh
        run: tests\ui\seed.ps1 -Remove
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-test-screenshots
          path: ui-test-output
