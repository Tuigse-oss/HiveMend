name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Win32 FFI and the GUI are cfg(windows), so they are only linted
        # on the Windows runner; Linux covers the cfg(not(windows)) branches.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The #[cfg(windows)] FFI and its live tests only compile and run on
        # Windows; a Linux-only run would ship them unexercised while green.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --locked --all-targets

  installer:
    name: installer (install, upgrade, uninstall)
    # Package managers upgrade by running the new installer over the old one,
    # so every change is checked with two builds of the installer.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 build --locked --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp target/x86_64-pc-windows-msvc/release/Hivemend.exe package/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt README.md package/
      - name: Build an older and a newer installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=0.0.1 /DOutputDir=..\installer-test installer\hivemend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc /DAppVersion=0.0.2 /DOutputDir=..\installer-test installer\hivemend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade, and uninstall
        shell: pwsh
        run: >
          installer\test-installer.ps1
          -Old installer-test\Hivemend-v0.0.1-x86_64-setup.exe -OldVersion 0.0.1
          -New installer-test\Hivemend-v0.0.2-x86_64-setup.exe -NewVersion 0.0.2
