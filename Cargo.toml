[package]
name = "hive-mend"
version = "0.1.0"
edition = "2024"
description = "Scan and repair stale Windows registry entries on Windows 10 and 11"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Brad Williamson"]
repository = "https://github.com/bradwilliamson/HiveMend"

# The program is Hivemend.exe; the crate and library keep the name hive-mend.
[[bin]]
name = "Hivemend"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Registry",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Restore",
    "Win32_System_Services",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
