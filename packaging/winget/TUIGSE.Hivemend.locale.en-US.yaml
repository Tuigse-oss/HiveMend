ShortDescription: Free, open-source registry cleaner for Windows 10/11 with backed-up, transactional repairs.
Description: |-
  Hivemend scans the Windows registry for stale entries left behind by removed programs and removes the ones you choose,
  each inside its own registry transaction after writing a backup that Restore can put back. It also manages startup items,
  installed programs, privacy cleanup, disk space, duplicate files, and services.
  No subscriptions, upsells, ads, account, or telemetry: Hivemend contains no networking code.
