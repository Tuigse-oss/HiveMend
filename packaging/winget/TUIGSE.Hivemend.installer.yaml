# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: TUIGSE.Hivemend
PackageVersion: {{VERSION}}
InstallerType: inno
# The Add/Remove Programs key Inno Setup writes for the installer's AppId, so
# winget recognizes an existing install and upgrades it in place.
ProductCode: '{6F1C2A4E-8B3D-4E7A-9C51-2D8E0B7F4A93}_is1'
MinimumOSVersion: 10.0.0.0
UpgradeBehavior: install
Installers:
  - Architecture: x64
    Scope: user
    InstallerUrl: {{SETUP_URL}}
    InstallerSha256: {{SETUP_SHA256}}
    InstallerSwitches:
      Custom: /CURRENTUSER
  - Architecture: x64
    Scope: machine
    ElevationRequirement: elevatesSelf
    InstallerUrl: {{SETUP_URL}}
    InstallerSha256: {{SETUP_SHA256}}
    InstallerSwitches:
      Custom: /ALLUSERS
ManifestType: installer
ManifestVersion: 1.10.0
